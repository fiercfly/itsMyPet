<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cozy Pets</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-card">
    
    <!-- Top Bar -->
    <header class="popup-header">
      <div class="brand">
        <h1 class="brand-title">Cozy Pets 🐾</h1>
      </div>
      <div class="header-controls">
        <button class="icon-btn" id="mute-btn" title="Toggle Sound (Mute/Unmute)">🎵</button>
        <label class="toggle-switch" title="Toggle companion visibility">
          <input type="checkbox" id="master-toggle" checked>
          <span class="slider"></span>
        </label>
      </div>
    </header>

    <!-- Hero section -->
    <section class="pet-hero">
      <div class="avatar-pedestal" id="avatar-pedestal" title="Tap to pet your companion">
        <div class="mini-pet-rig skin-orange-tabby state-idle" id="preview-pet">
          <div class="cat-rig">
            <div class="tail-anchor">
              <div class="single-cat-tail">
                <svg class="tail-svg" viewBox="0 0 60 70" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path class="tail-path-bg" d="M 44 64 C 22 52, 8 32, 12 18 C 15 7, 28 6, 32 12" stroke-linecap="round" stroke-linejoin="round" />
                  <path class="tail-path-main" d="M 44 64 C 22 52, 8 32, 12 18 C 15 7, 28 6, 32 12" stroke-linecap="round" stroke-linejoin="round" />
                  <path class="tail-path-tip" d="M 15 14 C 18 8, 27 7, 32 12" stroke-linecap="round" stroke-linejoin="round" />
                  <path class="tail-path-stripe s1" d="M 23 47 C 20 44, 18 42, 16 39" stroke-linecap="round" />
                  <path class="tail-path-stripe s2" d="M 13 29 C 12 26, 12 24, 13 21" stroke-linecap="round" />
                </svg>
              </div>
            </div>
            <div class="hind-legs"><div class="hind-leg left"></div><div class="hind-leg right"></div></div>
            <div class="torso"><div class="torso-belly"></div></div>
            <div class="front-paws"><div class="front-paw left"></div><div class="front-paw right"></div></div>
            <div class="cat-head">
              <div class="ear left"><div class="ear-inner"></div></div>
              <div class="ear right"><div class="ear-inner"></div></div>
              <div class="head-contour">
                <div class="head-base"><div class="head-stripes"><div class="head-stripe l"></div><div class="head-stripe c"></div><div class="head-stripe r"></div></div></div>
                <div class="muzzle-cheeks"><div class="cheek-puff l"></div><div class="cheek-puff r"></div></div>
              </div>
              <div class="face-cluster">
                <div class="blush-spots"><div class="blush"></div><div class="blush"></div></div>
                <div class="eyes-cluster">
                  <div class="panda-patch l"></div>
                  <div class="panda-patch r"></div>
                  <div class="eye l"></div><div class="eye-closed l"></div><div class="eye-heart l">❤️</div>
                  <div class="eye r"></div><div class="eye-closed r"></div><div class="eye-heart r">❤️</div>
                </div>
                <div class="nose"></div>
                <div class="mouth-normal"></div>
                <div class="mouth-open"><div class="mouth-tongue"></div></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="pet-profile">
        <input type="text" id="pet-name" class="pet-name-input" value="Mochi" maxlength="16" placeholder="Pet Name" />
        <button class="hide-hide-btn" id="btn-hide-pet" title="Hide pet into stealth peeking mode (pops up randomly!)">
          🙈 Hide & Surprise
        </button>
      </div>
    </section>

    <!-- Care & Toys (3 Core Options) -->
    <section class="section-group">
      <div class="section-label">Toys & Treats</div>
      <div class="btn-grid-3">
        <button class="tool-btn" id="btn-treat" title="Drop fresh fish treat on page">
          <span class="tool-icon">🐟</span>
          <span class="tool-name">Fish Cracker</span>
        </button>
        <button class="tool-btn" id="btn-sleep-toy" title="Teddy plushie for cozy sleep">
          <span class="tool-icon">🧸</span>
          <span class="tool-name">Teddy Plush</span>
        </button>
        <button class="tool-btn" id="btn-butterfly" title="Cute butterfly chase toy">
          <span class="tool-icon">🦋</span>
          <span class="tool-name">Butterfly</span>
        </button>
      </div>
    </section>

  </div>

  <script src="../content/audio-synthesizer.js"></script>
  <script src="popup.js"></script>
</body>
</html>
