<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cozy Pets</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-card">
    
    <!-- Top Bar -->
    <header class="popup-header">
      <div class="brand">
        <h1 class="brand-title">Cozy Pets</h1>
      </div>
      <div class="header-controls">
        <button class="icon-btn" id="mute-btn" title="Toggle Sound (Mute/Unmute)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>
        </button>
        <label class="toggle-switch" title="Toggle companion visibility">
          <input type="checkbox" id="master-toggle" checked>
          <span class="slider"></span>
        </label>
      </div>
    </header>

    <!-- Hero section -->
    <section class="pet-hero">
      <div class="avatar-pedestal" id="avatar-pedestal" title="Tap to pet your companion">
        <img src="../icons/profile_pic.jpg" class="pet-profile-pic" alt="Pet Profile">
      </div>

      <div class="pet-profile">
        <input type="text" id="pet-name" class="pet-name-input" value="Billuuu" maxlength="16" placeholder="Pet Name" />
        <button class="hide-hide-btn" id="btn-hide-pet" title="Hide pet into stealth peeking mode (pops up randomly!)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;margin-right:6px;vertical-align:middle;margin-top:-2px;"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle><line x1="3" y1="3" x2="21" y2="21"></line></svg>
          Hide & Surprise
        </button>
      </div>
    </section>

    <!-- Care & Toys (3 Core Options) -->
    <section class="section-group">
      <div class="section-label">Toys & Treats</div>
      <div class="btn-grid-3">
        <button class="tool-btn" id="btn-treat" title="Drop fresh fish treat on page">
          <span class="tool-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;"><path d="M22 12c0 6-4.39 10-9.8 10C6 22 2 12 2 12s4-10 10.2-10C17.61 2 22 6 22 12z"></path><path d="M2 12h4"></path><path d="M12 22v-4"></path><path d="M12 6V2"></path></svg>
          </span>
          <span class="tool-name">Fish Cracker</span>
        </button>
        <button class="tool-btn" id="btn-sleep-toy" title="Teddy plushie for cozy sleep">
          <span class="tool-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;"><rect x="3" y="11" width="18" height="10" rx="2"></rect><circle cx="12" cy="5" r="2"></circle><path d="M12 7v4"></path><line x1="8" y1="16" x2="8" y2="16"></line><line x1="16" y1="16" x2="16" y2="16"></line></svg>
          </span>
          <span class="tool-name">Teddy Plush</span>
        </button>
        <button class="tool-btn" id="btn-butterfly" title="Cute butterfly chase toy">
          <span class="tool-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;"><path d="M12 2v20"></path><path d="M12 12c-4-4-8-4-8-8 4 0 8 4 8 8z"></path><path d="M12 12c4-4 8-4 8-8-4 0-8 4-8 8z"></path><path d="M12 12c-4 4-8 4-8 8 4 0 8-4 8-8z"></path><path d="M12 12c4 4 8 4 8 8-4 0-8-4-8-8z"></path></svg>
          </span>
          <span class="tool-name">Butterfly</span>
        </button>
      </div>
    </section>

  </div>

  <script src="../content/audio-synthesizer.js"></script>
  <script src="popup.js"></script>
</body>
</html>
